name: EchoStreamBench canonical657
description: >
  EchoStreamBench canonical657 is a benchmark for studying memory in streaming
  video understanding: how models and memory architectures retain and use
  earlier visual information as a video unfolds. The fixed 657-item suite
  contains 647 multiple-choice questions and 10 open-ended questions, with
  public reference answers and a local scorer. Source videos are obtained
  from the upstream benchmarks under their original licenses.

leaderboard:
  base_models_only: false

tasks:
  - id: canonical657
    config: default
    split: train
