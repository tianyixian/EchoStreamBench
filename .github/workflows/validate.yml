name: Validate release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate questions and public answers
        run: python scripts/validate_public_release.py
      - name: Verify release file checksums
        run: python scripts/verify_checksums.py
