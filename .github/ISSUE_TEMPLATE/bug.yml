name: Bug report or data correction
description: Report a reproducibility issue, broken source link, or data correction.
title: "[Issue] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe expected and actual behavior; include public_id for item-specific issues.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction details
      description: Release version, command, Python version, and relevant error text. Remove credentials and private paths.
    validations:
      required: true
